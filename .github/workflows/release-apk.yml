name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and upload (for example: v0.1.254). Leave blank to use the package version.'
        required: false
        type: string
      publish:
        description: 'Publish or replace GitHub Release assets (requires release approval).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-mobile-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout mobile repo
        uses: actions/checkout@v4
        with:
          path: HANDCASH-MOBILE
          ref: ${{ inputs.tag || github.sha }}

      - name: Read pinned Desktop source
        id: core
        run: echo "sha=$(node -p "require('./HANDCASH-MOBILE/ui-core-source.json').gitSha")" >> "$GITHUB_OUTPUT"

      - name: Checkout Desktop UI core sibling
        uses: actions/checkout@v4
        with:
          repository: HandCash/HANDCASH-DESKTOP
          path: HANDCASH-DESKTOP
          ref: ${{ steps.core.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            HANDCASH-MOBILE/package-lock.json
            HANDCASH-DESKTOP/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK comes from scripts/build-apk.sh (portable cmdline-tools).
      # Do not use android-actions/setup-android — it still asks for obsolete `tools`.

      - name: Read release metadata
        id: meta
        working-directory: HANDCASH-MOBILE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building HandCash Mobile ${VERSION} → release ${TAG}"

      - name: Install Desktop deps (UI-core tsc)
        working-directory: HANDCASH-DESKTOP
        run: npm ci

      - name: Restore production signing keys
        env:
          PARENT_BASE64: ${{ secrets.HANDCASH_ANDROID_KEYSTORE_BASE64 }}
          NEXT_BASE64: ${{ secrets.HANDCASH_ANDROID_NEXT_KEYSTORE_BASE64 }}
        run: |
          # Production lineage (native-android/signing-lineage.bin):
          #   parent Mac/debug b6de… → HandCash Wallet 4a0dae… (same as 0.1.764 users)
          # Lab/debug APKs must never ship to users — they cannot upgrade that install base.
          test -n "$PARENT_BASE64" || {
            echo "Missing HANDCASH_ANDROID_KEYSTORE_BASE64 (lineage parent). On the Mac: bash scripts/export-release-signing.sh" >&2
            exit 1
          }
          test -n "$NEXT_BASE64" || {
            echo "Missing HANDCASH_ANDROID_NEXT_KEYSTORE_BASE64 (handcash-release.p12). On the Mac: bash scripts/export-release-signing.sh" >&2
            exit 1
          }
          printf '%s' "$PARENT_BASE64" | base64 --decode > "$RUNNER_TEMP/handcash-parent.keystore"
          chmod 600 "$RUNNER_TEMP/handcash-parent.keystore"
          mkdir -p "$HOME/.handcash/android-signing"
          printf '%s' "$NEXT_BASE64" | base64 --decode > "$HOME/.handcash/android-signing/handcash-release.p12"
          chmod 600 "$HOME/.handcash/android-signing/handcash-release.p12"

      - name: Build APK
        working-directory: HANDCASH-MOBILE
        env:
          # Default HANDCASH_BUILD_TYPE=release → assembleRelease + v3 lineage rotate
          HANDCASH_ANDROID_KEYSTORE: ${{ runner.temp }}/handcash-parent.keystore
          HANDCASH_ANDROID_STORE_PASSWORD: ${{ secrets.HANDCASH_ANDROID_STORE_PASSWORD }}
          HANDCASH_ANDROID_KEY_ALIAS: ${{ secrets.HANDCASH_ANDROID_KEY_ALIAS }}
          HANDCASH_ANDROID_KEY_PASSWORD: ${{ secrets.HANDCASH_ANDROID_KEY_PASSWORD }}
          HANDCASH_ANDROID_CERT_SHA256: ${{ secrets.HANDCASH_ANDROID_CERT_SHA256 }}
          HANDCASH_ANDROID_NEXT_KEYSTORE: /home/runner/.handcash/android-signing/handcash-release.p12
          HANDCASH_ANDROID_NEXT_STORE_PASSWORD: ${{ secrets.HANDCASH_ANDROID_NEXT_STORE_PASSWORD }}
          HANDCASH_ANDROID_NEXT_KEY_ALIAS: ${{ secrets.HANDCASH_ANDROID_NEXT_KEY_ALIAS }}
          HANDCASH_ANDROID_NEXT_CERT_SHA256: ${{ secrets.HANDCASH_ANDROID_NEXT_CERT_SHA256 }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-apk.sh

      - name: Keep signed APK and provenance as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handcash-mobile-${{ steps.meta.outputs.version }}
          path: |
            HANDCASH-MOBILE/artifacts/*.apk
            HANDCASH-MOBILE/artifacts/*.sha256
            HANDCASH-MOBILE/artifacts/*.ui-core-pin.json
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "HandCash Mobile ${{ steps.meta.outputs.version }}" \
              --notes "HandCash Mobile ${{ steps.meta.outputs.version }} — production-signed APK (lineage matches 0.1.764: upgrades in place)." \
              --latest \
              --target "${{ github.sha }}"
          fi

      - name: Upload APK and metadata
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: HANDCASH-MOBILE
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          files=(artifacts/*.apk artifacts/*.sha256 artifacts/*.ui-core-pin.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK artifacts found under artifacts/" >&2
            ls -la artifacts/ || true
            exit 1
          fi

          for f in "${files[@]}"; do
            name="$(basename "$f")"
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done

          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded to $TAG:"
          printf '  %s\n' "${files[@]}"
