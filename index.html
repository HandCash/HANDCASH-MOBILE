<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>HandCash Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Syncopate:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic script: free `process`/`Buffer` bindings before any ES module runs.
         Module-only globalThis assignment is not enough for scrypt-ts on Android WebView. -->
    <script>
      (function () {
        var g = typeof globalThis !== 'undefined' ? globalThis : window
        if (!g.process || typeof g.process !== 'object') {
          g.process = {
            env: { NETWORK: '', BASEURL: '', NODE_ENV: 'production' },
            browser: true,
            version: 'v18.0.0',
            versions: { node: '18.0.0' },
            platform: 'browser',
            title: 'browser',
            argv: [],
            pid: 0,
            cwd: function () { return '/' },
            nextTick: function (fn) {
              var args = Array.prototype.slice.call(arguments, 1)
              queueMicrotask(function () { fn.apply(null, args) })
            },
          }
        } else {
          g.process.env = g.process.env || {}
          if (g.process.env.NETWORK === undefined) g.process.env.NETWORK = ''
          if (g.process.env.BASEURL === undefined) g.process.env.BASEURL = ''
          if (g.process.env.NODE_ENV === undefined) g.process.env.NODE_ENV = 'production'
          if (typeof g.process.cwd !== 'function') g.process.cwd = function () { return '/' }
          if (typeof g.process.nextTick !== 'function') {
            g.process.nextTick = function (fn) {
              var args = Array.prototype.slice.call(arguments, 1)
              queueMicrotask(function () { fn.apply(null, args) })
            }
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
